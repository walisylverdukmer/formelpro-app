name: formelpro
description: "Application professionnelle FormelPro - Solution Makers Sarl"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Localisation Flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2

  # Backend / Database
  supabase_flutter: ^2.12.0

  # Local storage
  shared_preferences: ^2.5.1

  # Internationalisation
  intl: ^0.20.2

  # Navigation externe
  url_launcher: ^6.3.0

  # Firebase / Notifications Push
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Géolocalisation
  geolocator: ^10.1.0

  # Cartes OpenStreetMap
  flutter_map: ^6.1.0
  latlong2: ^0.9.1

  # Sélection d'image depuis la galerie
  image_picker: ^1.0.7

  # HTTP
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/