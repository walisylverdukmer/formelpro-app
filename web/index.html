<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="FormelPro — Mise en relation géolocalisée entre clients et techniciens certifiés. Côte d'Ivoire & Cameroun.">

  <!-- PWA / Mobile meta -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FormelPro">
  <meta name="theme-color" content="#E67E22">
  <meta name="msapplication-TileColor" content="#0F172A">

  <!-- Icons -->
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>FormelPro</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0F172A; }

    #splash-screen {
      position: fixed;
      inset: 0;
      background: #0F172A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    #splash-screen img {
      width: 110px;
      height: 110px;
      object-fit: contain;
      border-radius: 20px;
    }
    #splash-screen .splash-title {
      margin-top: 18px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 2px;
    }
    #splash-screen .splash-sub {
      margin-top: 6px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: rgba(255,255,255,0.55);
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #splash-screen .splash-spinner {
      margin-top: 40px;
      width: 28px;
      height: 28px;
      border: 3px solid rgba(230,126,34,0.25);
      border-top-color: #E67E22;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    /* PWA Install Banner */
    #pwa-banner {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #1E293B;
      padding: 14px 20px;
      align-items: center;
      gap: 14px;
      z-index: 99999;
      border-top: 1px solid rgba(230, 126, 34, 0.35);
      box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.4);
    }
    #pwa-banner img {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      object-fit: contain;
      background: #0F172A;
      flex-shrink: 0;
    }
    #pwa-banner .pwa-text { flex: 1; }
    #pwa-banner .pwa-text strong {
      display: block;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
    }
    #pwa-banner .pwa-text span {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px;
      color: #94a3b8;
    }
    #pwa-install-btn {
      background: #E67E22;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #pwa-install-btn:active { opacity: 0.85; }
    #pwa-close-btn {
      background: transparent;
      color: #64748b;
      border: none;
      font-size: 22px;
      cursor: pointer;
      padding: 4px 6px;
      line-height: 1;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- Splash screen (visible avant le chargement Flutter) -->
  <div id="splash-screen">
    <img src="logo.png" alt="FormelPro">
    <div class="splash-title">FORMELPRO</div>
    <div class="splash-sub">L'excellence à votre portée</div>
    <div class="splash-spinner"></div>
  </div>

  <!-- Bannière installation PWA -->
  <div id="pwa-banner">
    <img src="logo.png" alt="FormelPro">
    <div class="pwa-text">
      <strong>Installer FormelPro</strong>
      <span>Accès rapide depuis votre écran d'accueil</span>
    </div>
    <button id="pwa-install-btn">Installer</button>
    <button id="pwa-close-btn">✕</button>
  </div>

  <script>
    // ── Splash screen : masquer après le premier rendu Flutter ──
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash-screen');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function () { splash.remove(); }, 600);
      }
    });

    // ── PWA install prompt ──
    var deferredPrompt = null;

    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferredPrompt = e;
      var banner = document.getElementById('pwa-banner');
      if (banner) banner.style.display = 'flex';
    });

    window.addEventListener('appinstalled', function () {
      var banner = document.getElementById('pwa-banner');
      if (banner) banner.style.display = 'none';
      deferredPrompt = null;
    });

    document.addEventListener('DOMContentLoaded', function () {
      var installBtn = document.getElementById('pwa-install-btn');
      var closeBtn = document.getElementById('pwa-close-btn');

      if (installBtn) {
        installBtn.addEventListener('click', function () {
          if (!deferredPrompt) return;
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(function () {
            deferredPrompt = null;
            var banner = document.getElementById('pwa-banner');
            if (banner) banner.style.display = 'none';
          });
        });
      }

      if (closeBtn) {
        closeBtn.addEventListener('click', function () {
          var banner = document.getElementById('pwa-banner');
          if (banner) banner.style.display = 'none';
        });
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
